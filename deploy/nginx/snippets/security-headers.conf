# Заголовки безопасности для ответов, которые формирует сам nginx
# (статика, HTML-страницы, страницы ошибок).
#
# Значения совпадают с backend/app.py (end_headers, CSP). Меняя одно место,
# меняйте и второе: приложение отдаёт эти же заголовки для /api/, и расхождение
# приведёт к тому, что политика сайта будет зависеть от того, кто ответил.
#
# Подключается через include только в тех location, которые отдают файлы.
# В location /api/ его нет намеренно: nginx add_header наследуется в локацию
# только если в ней нет собственных add_header, а заголовки приложения
# проксируются как есть — иначе каждый заголовок пришёл бы дважды.
#
# HSTS отправляется только из HTTPS-сервер-блока: по открытому HTTP браузеры
# его игнорируют, а в блоке порта 80 сниппет не подключается.

add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options            "DENY"                                always;
add_header X-Content-Type-Options     "nosniff"                             always;
add_header Referrer-Policy            "strict-origin"                       always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                         always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
